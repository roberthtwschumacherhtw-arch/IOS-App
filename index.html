<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Logbuch</title>
<style>body{margin:0;background:#e7e9ec;min-height:100vh;display:flex;justify-content:center;font-family:'Instrument Sans',system-ui,sans-serif}
  .frame{width:392px;min-height:100vh;background:#10151A}</style>
</head><body>
<div class="frame">
  <logbuch-app></logbuch-app>
</div>
<script>
  // Beispieldaten NUR, wenn noch nichts gespeichert ist — damit die Integration sichtbar ist.
  (function seed(){
    if (localStorage.getItem('logbuch.demoseed') === 'v2') return;
    const iso = d => new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
    const day = n => iso(new Date(Date.now()-n*864e5));
    const body = [], workouts = [];
    let w = 83.6;
    for (let i=29;i>=0;i--){ w -= 0.11 + (Math.random()-0.5)*0.2; body.push({ date:day(i), weight:Math.round(w*10)/10, kcal:1900+Math.round(Math.random()*500), steps:6000+Math.round(Math.random()*6000) }); }
    body[0].meals = [
      { id:'m1', name:'Frühstück', pname:'Haferflocken', g:80, kcal:300, protein:10, fat:6, carbs:52 },
      { id:'m2', name:'Mittagessen', pname:'Hähnchen + Reis', g:400, kcal:640, protein:55, fat:12, carbs:70 },
    ];
    const today = body[body.length-1];
    today.meals = [
      { id:'m1', name:'Frühstück', pname:'Haferflocken', g:80, kcal:300, protein:10, fat:6, carbs:52 },
      { id:'m2', name:'Mittagessen', pname:'Hähnchenbrust + Reis', g:400, kcal:640, protein:55, fat:12, carbs:70 },
      { id:'m3', name:'Abendessen', pname:'Lachs + Kartoffeln', g:400, kcal:500, protein:38, fat:20, carbs:20, fiber:8, salt:2.1 },
    ];
    today.kcal = 1560; today.protein = 128; today.fat = 52; today.carbs = 142;
    const ex = ['Bankdrücken','Latzug','Kniebeuge','Schulterdrücken KH'];
    for (let s=0;s<14;s++){ const sid='s'+s; const e = ex[s%ex.length];
      workouts.push({ id:'w'+s, sessionId:sid, date:day(29-s*2), day:['Push','Pull','Legs'][s%3], exercise:e, sets:[{w:80+s,r:8},{w:80+s,r:7},{w:75+s,r:8}] }); }
    const db = { exercises:['Bankdrücken','Schrägbankdrücken KH','Kniebeuge','Kreuzheben','Latzug','Schulterdrücken KH','Beinpresse','Bizepscurls KH','Trizepsdrücken Kabel'],
      workouts, body, splits:[{ name:'Push / Pull / Legs', days:[
        { name:'Push', exercises:['Bankdrücken','Schulterdrücken KH','Trizepsdrücken Kabel'] },
        { name:'Pull', exercises:['Kreuzheben','Latzug','Bizepscurls KH'] },
        { name:'Legs', exercises:['Kniebeuge','Beinpresse'] } ]}],
      sex:'m', age:28, height:182, mealTypes:['Frühstück','Mittagessen','Abendessen','Snack'],
      goals:{ sessions:3, setsPerMuscle:10, kcalTarget:2050, proteinTarget:150 },
      nutrition:{ phase:'cut', cutLevel:'moderat', mode:'auto' }, ui:{ theme:'dark' } };
    localStorage.setItem('logbuch.v1', JSON.stringify(db));
    localStorage.setItem('logbuch.demoseed', 'v2');
  })();
</script>
<script src="koerper-view.js"></script>
<script src="analyse-view.js"></script>
<script src="training-view.js"></script>
<script src="plan-view.js"></script>
<script src="daten-view.js"></script>
<script src="bottom-nav.js"></script>
<script src="logbuch-app.js"></script>
</body></html>
